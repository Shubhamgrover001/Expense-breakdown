<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Expense Breakdown</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#090d16">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header><div class="wrap">
 <div class="r1">
  <div class="brand">₹ Expense Breakdown <small id="saved">● Saved</small></div>
  <div class="msw"><button class="ib" data-a="prev" aria-label="Previous month">◀</button><b id="mlabel"></b><button class="ib" data-a="next" aria-label="Next month">▶</button></div>
 </div>
 <div class="pills">
  <button class="pill" data-a="newmonth">+ Month</button>
  <button class="pill" data-a="all">All Months</button>
  <button class="pill" data-a="sync">Keep Sync</button>
  <button class="pill" data-a="theme">Theme</button>
  <button class="pill" data-a="refresh">↻ Refresh</button>
  <button class="pill" data-a="pdf">🖨 PDF</button>
  <button class="pill" data-a="install" id="installBtn" style="display:none">Install App</button>
 </div>
</div></header>

<main class="wrap" id="app"></main>

<nav class="bottom">
 <button data-a="go" data-t="sec-sum"><i>▦</i>Summary</button>
 <button data-a="go" data-t="sec-ch"><i>◔</i>Charts</button>
 <button data-a="go" data-t="sec-cal"><i>▤</i>Calendar</button>
 <button class="fab" data-a="add" aria-label="Add expense">+</button>
 <button data-a="pdf"><i>🖨</i>PDF</button>
 <button data-a="refresh"><i>↻</i>Refresh</button>
</nav>

<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<div id="print"></div>

<script src="app.js"></script>
</body>
</html>
